<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>가품매장 관제 지도</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>
  <div class="app">
    <!-- ===================== ① 좌측 아이콘 레일 (네이버 스타일) ===================== -->
    <nav class="rail" aria-label="주요 메뉴">
      <div class="rail-logo" title="가품매장 관제 지도">FS</div>
      <button type="button" class="rail-item active" data-view="map">
        <span class="rail-ico">🗺️</span><span class="rail-label">지도</span>
      </button>
      <button type="button" class="rail-item" data-view="our">
        <span class="rail-ico">🏬</span><span class="rail-label">우리매장</span>
      </button>
      <button type="button" class="rail-item" data-view="fake">
        <span class="rail-ico">🚩</span><span class="rail-label">가품매장</span>
      </button>
      <button type="button" class="rail-item" data-view="stats">
        <span class="rail-ico">📊</span><span class="rail-label">현황</span>
      </button>
      <div class="rail-bottom">
        <button type="button" class="rail-item" id="railAdmin">
          <span class="rail-ico">🔒</span><span class="rail-label">관리자</span>
        </button>
      </div>
    </nav>

    <!-- ===================== ② 검색 결과 패널 ===================== -->
    <section class="panel" id="panel">
      <!-- 모바일 바텀시트 드래그 핸들 -->
      <button type="button" class="sheet-handle" id="sheetHandle" aria-label="목록 크기 조절"></button>
      <header class="panel-head">
        <div class="search-box">
          <span class="search-ico" aria-hidden="true">🔍</span>
          <input type="search" id="searchInput" placeholder="매장명·주소·상품·상권 검색" />
          <button type="button" id="searchClear" class="search-clear" aria-label="검색어 지우기" hidden>✕</button>
        </div>
        <button type="button" class="panel-close" id="panelClose" aria-label="지도 보기">지도 보기 ✕</button>
      </header>

      <!-- 지표 요약 -->
      <div class="metric-row">
        <div class="metric">
          <span class="metric-num" id="fakeCount">-</span>
          <span class="metric-lbl">가품매장</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric">
          <span class="metric-num" id="ourCount">-</span>
          <span class="metric-lbl">우리매장</span>
        </div>
      </div>

      <!-- 반경 & 필터 -->
      <div class="filters">
        <div class="radius-wrap">
          <label for="radiusRange">검색 반경 <b id="radiusLabel">5</b>km</label>
          <input type="range" id="radiusRange" min="1" max="20" step="1" value="5" />
        </div>
        <div class="filter-grid">
          <select id="typeFilter" aria-label="유형"><option value="ALL">유형 전체</option></select>
          <select id="operatingFilter" aria-label="영업여부"><option value="ALL">영업여부 전체</option></select>
          <select id="areaFilter" aria-label="상권"><option value="ALL">상권 전체</option></select>
          <select id="productFilter" aria-label="판매상품"><option value="ALL">판매상품 전체</option></select>
        </div>
        <button type="button" id="resetBtn" class="reset-btn">전체 보기 · 필터 초기화</button>
      </div>

      <!-- 목록 (탭) -->
      <div class="list-tabs">
        <button type="button" class="list-tab active" data-list="our">우리매장 <span class="tab-chip" id="ourListCount">0</span></button>
        <button type="button" class="list-tab" data-list="fake">가품매장 <span class="tab-chip" id="fakeListCount">0</span></button>
      </div>

      <div class="list-scroll">
        <div class="store-list" id="ourStoreList" data-panel="our"></div>
        <div class="store-list" id="fakeStoreList" data-panel="fake" hidden></div>
      </div>
    </section>

    <!-- 패널 접기 손잡이 (네이버 스타일) -->
    <button type="button" id="panelToggle" class="panel-toggle" aria-label="패널 접기">‹</button>

    <!-- ===================== ③ 지도 영역 ===================== -->
    <main class="map-area">
      <div id="map"></div>

      <!-- 상단 카테고리 칩 바 -->
      <div class="chip-bar" id="chipBar">
        <button type="button" class="chip active" data-chip="ALL">전체</button>
        <!-- 유형 칩은 데이터에서 자동 생성 -->
      </div>

      <!-- 우측 지도 컨트롤 -->
      <div class="map-ctrl">
        <div class="ctrl-group ctrl-maptype">
          <button type="button" class="ctrl-btn active" data-maptype="ROADMAP">지도</button>
          <button type="button" class="ctrl-btn" data-maptype="HYBRID">위성</button>
        </div>
        <div class="ctrl-group">
          <button type="button" class="ctrl-btn zoom" id="zoomIn" aria-label="확대">+</button>
          <button type="button" class="ctrl-btn zoom" id="zoomOut" aria-label="축소">−</button>
        </div>
        <button type="button" class="ctrl-btn round" id="locBtn" aria-label="내 위치">◎</button>
      </div>

      <!-- 하단 중앙: 현 지도에서 검색 -->
      <button type="button" id="searchHere" class="search-here">🔄 이 지역 다시 검색</button>

      <!-- 모바일 패널 토글 -->
      <button type="button" id="mobileSidebarToggle" class="mobile-toggle" aria-label="목록 열기">☰ 목록 · 검색</button>
    </main>
  </div>

  <!-- 관리자 데이터 관리 모달 -->
  <div class="modal-backdrop" id="adminModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title"><span id="adminLock">🔒</span> 관리자 데이터 관리</span>
        <button type="button" id="adminClose" class="modal-close" aria-label="닫기">✕</button>
      </div>

      <div class="modal-body">
        <!-- 잠금: 로그인 -->
        <div id="adminLogin" class="admin-login">
          <p class="hint">데이터 업로드·초기화는 <b>관리자 전용</b>입니다. 비밀번호를 입력하세요.</p>
          <div class="login-row">
            <input type="password" id="adminPassword" placeholder="관리자 비밀번호" autocomplete="current-password" />
            <button type="button" id="adminLoginBtn" class="apple-btn">로그인</button>
          </div>
          <p class="hint err" id="loginError"></p>
        </div>

        <!-- 해제: 도구 -->
        <div id="adminTools" hidden>
          <div class="admin-bar">
            <span class="admin-badge">👤 관리자 모드</span>
            <button type="button" id="adminLogoutBtn" class="text-btn">로그아웃</button>
          </div>
          <p class="hint">엑셀(.xlsx) 또는 CSV 파일을 올리면 지도가 자동 업데이트됩니다. 위경도가 없으면 주소로 자동 변환합니다.</p>

          <label class="upload-label" for="ourFile">
            🏬 우리(정품) 매장 파일
            <input type="file" id="ourFile" accept=".xlsx,.xls,.csv" />
          </label>
          <label class="upload-label" for="fakeFile">
            🚩 가품 매장 파일
            <input type="file" id="fakeFile" accept=".xlsx,.xls,.csv" />
          </label>

          <div class="data-actions">
            <button type="button" id="downloadTemplateBtn" class="mini-btn">엑셀 양식 받기</button>
            <button type="button" id="clearDataBtn" class="mini-btn danger">데이터 초기화</button>
          </div>
          <p class="hint" id="dataStatus"></p>
          <div class="geo-progress" id="geoProgress" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 데이터 관리 진입 트리거(레일과 연결용, 접근성) -->
  <button type="button" id="dataToggle" hidden></button>

  <script>
    window.KAKAO_JAVASCRIPT_KEY = "403572f9beaf29324230415c29e983c1";
  </script>
  <script id="kakao-sdk"></script>
  <script src="js/app.js"></script>
</body>
</html>
