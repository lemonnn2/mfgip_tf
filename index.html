<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>가품매장 지도 MVP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background: #f3f4f6;
    }
    .app {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: 100vh;
      min-height: 640px;
    }
    .sidebar {
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      overflow-y: auto;
      padding: 18px;
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      background: #fafafa;
    }
    .metric .label {
      font-size: 12px;
      color: #6b7280;
    }
    .metric .value {
      font-size: 24px;
      font-weight: 800;
      margin-top: 4px;
    }
    .controls {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    select, button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { background: #f9fafb; }
    .section-title {
      font-size: 14px;
      font-weight: 800;
      margin: 18px 0 10px;
    }
    .store-list {
      display: grid;
      gap: 10px;
    }
    .store-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      cursor: pointer;
    }
    .store-card:hover {
      border-color: #9ca3af;
      background: #f9fafb;
    }
    .store-name {
      font-weight: 800;
      margin-bottom: 4px;
    }
    .store-meta {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 12px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
    }
    .dot.fake { background: #ef4444; }
    .dot.our { background: #2563eb; }
    .notice {
      padding: 10px 12px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #9a3412;
      margin-bottom: 14px;
    }
    .info-window {
      padding: 10px 12px;
      width: 260px;
      line-height: 1.45;
    }
    .info-title {
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .info-row {
      font-size: 12px;
      color: #374151;
      margin: 2px 0;
    }
    .impact-high { color: #dc2626; font-weight: 800; }
    .impact-mid { color: #d97706; font-weight: 800; }
    .impact-low { color: #059669; font-weight: 800; }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 420px 1fr;
      }
      .sidebar {
        order: 2;
        border-right: none;
        border-top: 1px solid #e5e7eb;
      }
      #map {
        order: 1;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="title">가품매장 지도 MVP</h1>
      <div class="subtitle">
        가품매장을 클릭하면 반경 5km 원과 주변 우리 매장 정보가 표시됩니다.
      </div>

      <div class="notice">
        실행 전 <b>YOUR_KAKAO_JAVASCRIPT_KEY</b>를 본인의 카카오 JavaScript 키로 교체하세요.
      </div>

      <div class="legend">
        <span class="legend-item"><span class="dot fake"></span>가품매장</span>
        <span class="legend-item"><span class="dot our"></span>우리매장</span>
      </div>

      <div class="metric-grid">
        <div class="metric">
          <div class="label">가품매장</div>
          <div class="value" id="fakeCount">-</div>
        </div>
        <div class="metric">
          <div class="label">우리매장</div>
          <div class="value" id="ourCount">-</div>
        </div>
      </div>

      <div class="controls">
        <select id="statusFilter">
          <option value="ALL">상태 전체</option>
        </select>
        <select id="stepFilter">
          <option value="ALL">Step 전체</option>
        </select>
        <button id="resetBtn">전체 지도 보기</button>
      </div>

      <div class="section-title">가품매장 목록</div>
      <div class="store-list" id="fakeStoreList"></div>
    </aside>

    <main id="map"></main>
  </div>

  <!-- 1) 여기에 카카오 JavaScript 키를 넣으세요. -->
  <script>
    const KAKAO_JAVASCRIPT_KEY = "403572f9beaf29324230415c29e983c1";
  </script>

  <!-- 2) 카카오맵 SDK 로드 -->
  <script id="kakao-sdk"></script>

  <script>
    const DATA_FILE = "./map-data.json";
    const RADIUS_METER = 5000;

    let map;
    let kakaoLoaded = false;
    let fakeStores = [];
    let ourStores = [];
    let fakeMarkers = [];
    let ourMarkers = [];
    let radiusCircle = null;
    let activeInfoWindow = null;

    function loadKakaoSdk() {
      return new Promise((resolve, reject) => {
        if (!KAKAO_JAVASCRIPT_KEY || KAKAO_JAVASCRIPT_KEY === "YOUR_KAKAO_JAVASCRIPT_KEY") {
          reject(new Error("카카오 JavaScript 키를 입력하세요."));
          return;
        }

        const script = document.getElementById("kakao-sdk");
        script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JAVASCRIPT_KEY}&autoload=false&libraries=services`;
        script.onload = () => {
          kakao.maps.load(() => {
            kakaoLoaded = true;
            resolve();
          });
        };
        script.onerror = () => reject(new Error("카카오맵 SDK 로드 실패"));
      });
    }

    async function loadData() {
      const res = await fetch(DATA_FILE, { cache: "no-store" });
      if (!res.ok) {
        throw new Error("map-data.json을 불러오지 못했습니다.");
      }
      const data = await res.json();
      fakeStores = data.fakeStores || [];
      ourStores = data.ourStores || [];
    }

    function initMap() {
      const center = new kakao.maps.LatLng(37.4979, 127.0276);
      map = new kakao.maps.Map(document.getElementById("map"), {
        center,
        level: 7
      });
    }

    function markerImage(color) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="48" viewBox="0 0 36 48">
          <path d="M18 0C8.1 0 0 8.1 0 18c0 13.5 18 30 18 30s18-16.5 18-30C36 8.1 27.9 0 18 0z" fill="${color}"/>
          <circle cx="18" cy="18" r="7" fill="white"/>
        </svg>
      `;
      const url = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      return new kakao.maps.MarkerImage(url, new kakao.maps.Size(36, 48), {
        offset: new kakao.maps.Point(18, 48)
      });
    }

    function renderMarkers() {
      clearMarkers();

      const status = document.getElementById("statusFilter").value;
      const step = document.getElementById("stepFilter").value;

      const visibleFakeStores = fakeStores.filter(store => {
        const statusOk = status === "ALL" || store.status === status;
        const stepOk = step === "ALL" || store.step === step;
        return statusOk && stepOk;
      });

      const fakeImage = markerImage("#ef4444");
      const ourImage = markerImage("#2563eb");

      visibleFakeStores.forEach(store => {
        const marker = new kakao.maps.Marker({
          map,
          position: new kakao.maps.LatLng(store.lat, store.lng),
          title: store.name,
          image: fakeImage
        });

        kakao.maps.event.addListener(marker, "click", () => selectFakeStore(store));
        fakeMarkers.push(marker);
      });

      ourStores.forEach(store => {
        const marker = new kakao.maps.Marker({
          map,
          position: new kakao.maps.LatLng(store.lat, store.lng),
          title: store.name,
          image: ourImage
        });

        kakao.maps.event.addListener(marker, "click", () => showOurStoreInfo(store, marker));
        ourMarkers.push(marker);
      });

      renderFakeStoreList(visibleFakeStores);
    }

    function clearMarkers() {
      fakeMarkers.forEach(marker => marker.setMap(null));
      ourMarkers.forEach(marker => marker.setMap(null));
      fakeMarkers = [];
      ourMarkers = [];
    }

    function selectFakeStore(fakeStore) {
      const center = new kakao.maps.LatLng(fakeStore.lat, fakeStore.lng);

      if (radiusCircle) radiusCircle.setMap(null);
      if (activeInfoWindow) activeInfoWindow.close();

      radiusCircle = new kakao.maps.Circle({
        center,
        radius: RADIUS_METER,
        strokeWeight: 2,
        strokeColor: "#ef4444",
        strokeOpacity: 0.9,
        strokeStyle: "solid",
        fillColor: "#ef4444",
        fillOpacity: 0.12
      });
      radiusCircle.setMap(map);

      const nearby = getNearbyOurStores(fakeStore, ourStores, 5);
      const impact = getImpactLevel(nearby);

      const marker = fakeMarkers.find(m => m.getTitle() === fakeStore.name);
      const content = fakeStoreInfoHtml(fakeStore, nearby, impact);
      activeInfoWindow = new kakao.maps.InfoWindow({ content });
      if (marker) activeInfoWindow.open(map, marker);

      map.panTo(center);
    }

    function showOurStoreInfo(store, marker) {
      if (activeInfoWindow) activeInfoWindow.close();

      const content = `
        <div class="info-window">
          <div class="info-title">우리매장: ${escapeHtml(store.name)}</div>
          <div class="info-row"><b>주소:</b> ${escapeHtml(store.address || "-")}</div>
          <div class="info-row"><b>담당자:</b> ${escapeHtml(store.owner || "-")}</div>
          <div class="info-row"><b>월매출:</b> ${formatCurrency(store.monthlySales)}</div>
        </div>
      `;
      activeInfoWindow = new kakao.maps.InfoWindow({ content });
      activeInfoWindow.open(map, marker);
    }

    function fakeStoreInfoHtml(fakeStore, nearby, impact) {
      const nearbyList = nearby.length
        ? nearby.slice(0, 5).map(item => `<div class="info-row">- ${escapeHtml(item.name)}: ${item.distanceKm.toFixed(2)}km</div>`).join("")
        : `<div class="info-row">반경 5km 내 우리매장 없음</div>`;

      const impactClass = impact === "높음" ? "impact-high" : impact === "중간" ? "impact-mid" : "impact-low";

      return `
        <div class="info-window">
          <div class="info-title">가품매장: ${escapeHtml(fakeStore.name)}</div>
          <div class="info-row"><b>주소:</b> ${escapeHtml(fakeStore.address || "-")}</div>
          <div class="info-row"><b>상태:</b> ${escapeHtml(fakeStore.status || "-")}</div>
          <div class="info-row"><b>Step:</b> ${escapeHtml(fakeStore.step || "-")}</div>
          <div class="info-row"><b>담당부서:</b> ${escapeHtml(fakeStore.department || "-")}</div>
          <div class="info-row"><b>담당자:</b> ${escapeHtml(fakeStore.owner || "-")}</div>
          <div class="info-row"><b>5km 내 우리매장:</b> ${nearby.length}개</div>
          <div class="info-row"><b>영향도:</b> <span class="${impactClass}">${impact}</span></div>
          <hr />
          ${nearbyList}
        </div>
      `;
    }

    function getNearbyOurStores(fakeStore, stores, radiusKm) {
      return stores
        .map(store => ({
          ...store,
          distanceKm: distanceKm(fakeStore.lat, fakeStore.lng, store.lat, store.lng)
        }))
        .filter(store => store.distanceKm <= radiusKm)
        .sort((a, b) => a.distanceKm - b.distanceKm);
    }

    function distanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function toRad(deg) {
      return deg * Math.PI / 180;
    }

    function getImpactLevel(nearbyStores) {
      const weightedSales = nearbyStores.reduce((sum, store) => {
        let weight = 0;
        if (store.distanceKm <= 1) weight = 1.0;
        else if (store.distanceKm <= 3) weight = 0.7;
        else if (store.distanceKm <= 5) weight = 0.4;
        return sum + (Number(store.monthlySales || 0) * weight);
      }, 0);

      if (nearbyStores.length >= 3 || weightedSales >= 150000000) return "높음";
      if (nearbyStores.length >= 1 || weightedSales >= 50000000) return "중간";
      return "낮음";
    }

    function renderFakeStoreList(stores) {
      const list = document.getElementById("fakeStoreList");
      list.innerHTML = "";

      if (!stores.length) {
        list.innerHTML = `<div class="store-meta">조건에 맞는 가품매장이 없습니다.</div>`;
        return;
      }

      stores.forEach(store => {
        const nearby = getNearbyOurStores(store, ourStores, 5);
        const card = document.createElement("div");
        card.className = "store-card";
        card.innerHTML = `
          <div class="store-name">${escapeHtml(store.name)}</div>
          <div class="store-meta">
            ${escapeHtml(store.status || "-")} · ${escapeHtml(store.step || "-")}<br />
            5km 내 우리매장 ${nearby.length}개
          </div>
        `;
        card.onclick = () => selectFakeStore(store);
        list.appendChild(card);
      });
    }

    function populateFilters() {
      const statusFilter = document.getElementById("statusFilter");
      const stepFilter = document.getElementById("stepFilter");

      const statuses = [...new Set(fakeStores.map(s => s.status).filter(Boolean))];
      const steps = [...new Set(fakeStores.map(s => s.step).filter(Boolean))];

      statuses.forEach(status => {
        const opt = document.createElement("option");
        opt.value = status;
        opt.textContent = status;
        statusFilter.appendChild(opt);
      });

      steps.forEach(step => {
        const opt = document.createElement("option");
        opt.value = step;
        opt.textContent = step;
        stepFilter.appendChild(opt);
      });

      statusFilter.onchange = renderMarkers;
      stepFilter.onchange = renderMarkers;
    }

    function updateMetrics() {
      document.getElementById("fakeCount").textContent = fakeStores.length;
      document.getElementById("ourCount").textContent = ourStores.length;
    }

    function fitAllMarkers() {
      if (activeInfoWindow) activeInfoWindow.close();
      if (radiusCircle) radiusCircle.setMap(null);

      const bounds = new kakao.maps.LatLngBounds();
      [...fakeStores, ...ourStores].forEach(store => {
        bounds.extend(new kakao.maps.LatLng(store.lat, store.lng));
      });
      map.setBounds(bounds);
    }

    function formatCurrency(value) {
      const n = Number(value || 0);
      if (!n) return "-";
      return n.toLocaleString("ko-KR") + "원";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function main() {
      try {
        await loadKakaoSdk();
        await loadData();
        initMap();
        populateFilters();
        updateMetrics();
        renderMarkers();
        fitAllMarkers();
        document.getElementById("resetBtn").onclick = fitAllMarkers;
      } catch (err) {
        document.body.innerHTML = `
          <div style="padding:24px;font-family:sans-serif;">
            <h2>지도 로딩 실패</h2>
            <p>${escapeHtml(err.message)}</p>
            <p>카카오 JavaScript 키, 도메인 등록, map-data.json 위치를 확인하세요.</p>
          </div>
        `;
        console.error(err);
      }
    }

    main();
  </script>
</body>
</html>
